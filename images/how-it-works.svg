<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Pyre Pensieve works</title>
  <desc id="d">Assistants save memory, instructions, chats, history and backups as files on your computer. Pyre Pensieve reads them in place, and lets you read, search, edit, find and remove secrets, take out a topic, delete with undo, and see what is in use.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a554d"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; fill: #928c82; }
      .card { fill: #1f1d1a; stroke: #2e2b27; stroke-width: 1; }
      .title { font-size: 14px; font-weight: 600; fill: #eeeae3; }
      .sub { font-size: 12px; fill: #928c82; }
      .wire { fill: none; stroke: #5a554d; stroke-width: 1.5; }
      .names { font-size: 12px; fill: #b6b0a6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="#161513" stroke="#2e2b27"/>

  <!-- What the assistants save -->
  <text class="label" x="24" y="40">WHAT THE ASSISTANTS SAVE</text>
  <g>
    <rect class="card" x="24" y="56" width="290" height="54" rx="10"/>
    <text class="title" x="40" y="78">Memory and notes</text>
    <text class="sub" x="40" y="97">MEMORY.md and other saved notes</text>

    <rect class="card" x="24" y="118" width="290" height="54" rx="10"/>
    <text class="title" x="40" y="140">Instructions and rules</text>
    <text class="sub" x="40" y="159">CLAUDE.md, AGENTS.md, rule files</text>

    <rect class="card" x="24" y="180" width="290" height="54" rx="10"/>
    <text class="title" x="40" y="202">Chats</text>
    <text class="sub" x="40" y="221">Every message, tool call and answer</text>

    <rect class="card" x="24" y="242" width="290" height="54" rx="10"/>
    <text class="title" x="40" y="264">History, logs and backups</text>
    <text class="sub" x="40" y="283">What you typed, copies of edited files</text>

    <rect class="card" x="24" y="304" width="290" height="54" rx="10"/>
    <text class="title" x="40" y="326">Any other Markdown</text>
    <text class="sub" x="40" y="345">Found by a scan of your drives</text>
  </g>

  <!-- Into the app -->
  <path class="wire" d="M314 83 C334 83 334 214 346 214" marker-end="url(#arrow)"/>
  <path class="wire" d="M314 145 C334 145 334 214 346 214" marker-end="url(#arrow)"/>
  <path class="wire" d="M314 207 C330 207 334 214 346 214" marker-end="url(#arrow)"/>
  <path class="wire" d="M314 269 C334 269 334 214 346 214" marker-end="url(#arrow)"/>
  <path class="wire" d="M314 331 C334 331 334 214 346 214" marker-end="url(#arrow)"/>

  <!-- The app -->
  <rect x="350" y="122" width="180" height="184" rx="18" fill="#1f1d1a" stroke="#e8926a" stroke-width="1.5"/>
  <g transform="translate(410 140)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#161513" stroke="#2e2b27"/>
    <path d="M17 11 h18 l9 9 v28 a3 3 0 0 1 -3 3 h-24 a3 3 0 0 1 -3 -3 v-34 a3 3 0 0 1 3 -3 z" fill="#ece7df"/>
    <path d="M35 11 v9 h9" fill="#cfc8bd"/>
    <rect x="20" y="24" width="16" height="3" rx="1.5" fill="#9c958a"/>
    <rect x="20" y="31" width="12" height="3" rx="1.5" fill="#9c958a"/>
    <rect x="20" y="38" width="9" height="3" rx="1.5" fill="#9c958a"/>
    <circle cx="40" cy="38" r="8" fill="none" stroke="#e8926a" stroke-width="3.5"/>
    <path d="M46 44 L52 50" stroke="#e8926a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="440" y="230" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#eeeae3">Pyre Pensieve</text>
  <text x="440" y="254" text-anchor="middle" class="sub">Runs on your computer</text>
  <text x="440" y="271" text-anchor="middle" class="sub">and reads files where</text>
  <text x="440" y="288" text-anchor="middle" class="sub">they already are</text>

  <!-- Out to what you can do -->
  <path class="wire" d="M530 214 C548 214 548 82 562 82" marker-end="url(#arrow)"/>
  <path class="wire" d="M530 214 C548 214 548 136 562 136" marker-end="url(#arrow)"/>
  <path class="wire" d="M530 214 C548 214 548 190 562 190" marker-end="url(#arrow)"/>
  <path class="wire" d="M530 214 C548 214 548 244 562 244" marker-end="url(#arrow)"/>
  <path class="wire" d="M530 214 C548 214 548 298 562 298" marker-end="url(#arrow)"/>
  <path class="wire" d="M530 214 C548 214 548 352 562 352" marker-end="url(#arrow)"/>

  <!-- What you can do -->
  <text class="label" x="566" y="40">WHAT YOU CAN DO</text>
  <g>
    <rect class="card" x="566" y="56" width="290" height="50" rx="10"/>
    <text class="title" x="582" y="77">Read and search everything</text>
    <text class="sub" x="582" y="95">Notes, rules and whole chats in one list</text>

    <rect class="card" x="566" y="110" width="290" height="50" rx="10"/>
    <text class="title" x="582" y="131">Edit</text>
    <text class="sub" x="582" y="149">A note, or one message in a chat</text>

    <rect x="566" y="164" width="290" height="50" rx="10" fill="#2a201b" stroke="#e8926a" stroke-width="1"/>
    <text class="title" x="582" y="185" style="fill:#f0a381">Find and remove</text>
    <text class="sub" x="582" y="203" style="fill:#c9a796">Keys and passwords left in plain text</text>

    <rect class="card" x="566" y="218" width="290" height="50" rx="10"/>
    <text class="title" x="582" y="239">Take out a whole topic</text>
    <text class="sub" x="582" y="257">Claude suggests, you approve each change</text>

    <rect class="card" x="566" y="272" width="290" height="50" rx="10"/>
    <text class="title" x="582" y="293">Delete, with undo</text>
    <text class="sub" x="582" y="311">Files go to the Recycle Bin or Trash</text>

    <rect class="card" x="566" y="326" width="290" height="50" rx="10"/>
    <text class="title" x="582" y="347">See what's in use</text>
    <text class="sub" x="582" y="365">What running sessions have open</text>
  </g>

  <!-- Assistants it knows -->
  <rect class="card" x="24" y="394" width="832" height="56" rx="10"/>
  <text class="names" x="440" y="417" text-anchor="middle">Claude Code · Codex · Gemini CLI · Antigravity · GitHub Copilot · Cursor · Windsurf · Devin</text>
  <text class="names" x="440" y="437" text-anchor="middle">Cline · Roo Code · Kiro · Continue · Qwen Code · Factory Droid · Aider · opencode · Ollama</text>
</svg>
